<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="70%" stop-color="#0c0a09" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- Amber Gold Gradient -->
    <linearGradient id="amberGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="80%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Warm Fire Glow -->
    <linearGradient id="bladeGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Steel / Titanium Gradient -->
    <linearGradient id="titanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#e2e8f0" />
      <stop offset="85%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Outer Ring Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Base (Perfect for Gmail Avatar Crop) -->
  <circle cx="256" cy="256" r="252" fill="url(#bgGrad)" />

  <!-- Outer Subtle Ring -->
  <circle cx="256" cy="256" r="248" fill="none" stroke="#292524" stroke-width="2" />
  <circle cx="256" cy="256" r="238" fill="none" stroke="url(#amberGold)" stroke-width="2.5" opacity="0.4" stroke-dasharray="14 8" />

  <!-- Inner Ambient Glow Circle -->
  <circle cx="256" cy="256" r="140" fill="#f59e0b" opacity="0.04" filter="url(#goldGlow)" />

  <!-- Center Geometric Emblem -->
  <!-- Left Code Bracket `<` -->
  <path d="M 175 195 L 125 256 L 175 317" fill="none" stroke="url(#amberGold)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Right Code Bracket `>` -->
  <path d="M 337 195 L 387 256 L 337 317" fill="none" stroke="url(#amberGold)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Center Slash / Duel Cross -->
  <!-- Sword 1: Top-Left to Bottom-Right -->
  <g transform="rotate(45 256 256)">
    <!-- Blade -->
    <path d="M 252 100 L 256 70 L 260 100 L 260 380 L 252 380 Z" fill="url(#titanium)" />
    <!-- Center Ridge -->
    <line x1="256" y1="75" x2="256" y2="380" stroke="#0f172a" stroke-width="1.5" opacity="0.6" />
    <!-- Guard -->
    <rect x="232" y="380" width="48" height="10" rx="3" fill="url(#amberGold)" />
    <!-- Handle -->
    <rect x="250" y="390" width="12" height="42" rx="2" fill="#1c1917" stroke="#78716c" stroke-width="1" />
    <!-- Pommel -->
    <circle cx="256" cy="438" r="8" fill="url(#amberGold)" />
  </g>

  <!-- Sword 2: Top-Right to Bottom-Left -->
  <g transform="rotate(-45 256 256)">
    <!-- Blade -->
    <path d="M 252 100 L 256 70 L 260 100 L 260 380 L 252 380 Z" fill="url(#titanium)" />
    <!-- Center Ridge -->
    <line x1="256" y1="75" x2="256" y2="380" stroke="#0f172a" stroke-width="1.5" opacity="0.6" />
    <!-- Guard -->
    <rect x="232" y="380" width="48" height="10" rx="3" fill="url(#amberGold)" />
    <!-- Handle -->
    <rect x="250" y="390" width="12" height="42" rx="2" fill="#1c1917" stroke="#78716c" stroke-width="1" />
    <!-- Pommel -->
    <circle cx="256" cy="438" r="8" fill="url(#amberGold)" />
  </g>

  <!-- Central Energy Spark at Clash Intersection -->
  <circle cx="256" cy="256" r="10" fill="#ffffff" filter="url(#goldGlow)" />
  <circle cx="256" cy="256" r="5" fill="#fef08a" />

  <!-- Subtle Minimal Bottom Brand Text (Curved / Modern) -->
  <text x="256" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" letter-spacing="6" fill="#f5f5f4" text-anchor="middle">
    CODE<tspan fill="#f59e0b">CLASH</tspan>
  </text>
  <text x="256" y="438" font-family="monospace" font-size="10" font-weight="700" letter-spacing="3" fill="#a8a29e" text-anchor="middle">
    INVERTIS UNIVERSITY
  </text>
</svg>
